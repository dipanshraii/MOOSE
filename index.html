<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOOSE – Music Player</title>
<meta name="theme-color" content="#121212">
<meta name="description" content="MOOSE music player. Made by Dipansh Rai.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOOSE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#121212;--card:#181818;--hover:#2a2a2a;--tx:#fff;--mut:#b3b3b3;--g:#1ed760;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#121212}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:8px;height:100%}
aside{background:var(--panel);border-radius:10px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{font-size:22px;font-weight:800;padding:4px 12px 14px;letter-spacing:-.5px}
.logo span{color:var(--g)}
.nav{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px;color:var(--mut);font-weight:700;font-size:15px}
.nav:hover,.nav.on{color:var(--tx)}
.nav.on{background:var(--card)}
.up{margin-top:auto;border:1px solid #444;border-radius:20px;padding:9px 14px;text-align:center;font-weight:700;cursor:pointer;color:var(--mut)}
.up:hover{color:var(--tx);border-color:var(--tx)}
main{background:var(--panel);border-radius:10px;overflow:auto;padding:0 24px 24px;background-image:linear-gradient(180deg,#2b3a2f 0,var(--panel) 280px);background-repeat:no-repeat}
h1{font-size:30px;margin:28px 0 16px;letter-spacing:-.5px}
h2{font-size:20px;margin:28px 0 12px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.q{display:flex;align-items:center;gap:12px;background:#ffffff14;border-radius:6px;overflow:hidden;text-align:left;font-weight:700;padding-right:10px}
.q:hover{background:#ffffff26}
.cv{width:48px;height:48px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;border-radius:4px}
.q .cv{width:56px;height:56px;border-radius:0}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) 120px 40px 50px;align-items:center;gap:12px;padding:6px 12px;border-radius:6px;color:var(--mut)}
.row:hover{background:#ffffff1a}
.row .n{text-align:center}
.row .ti{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.row .ti div{min-width:0}
.row b{display:block;color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now b,.row.now .n{color:var(--g)}
.heart.on{color:var(--g)}
.search{width:100%;max-width:420px;background:#ffffff1f;border:0;border-radius:24px;padding:12px 18px;color:var(--tx);font:inherit;margin-top:28px}
.credit{color:var(--mut);font-size:12px;text-align:center;padding:10px 0 2px}
.credit-main{color:var(--mut);font-size:12px;margin-top:32px}
button.up{background:none;width:100%;font:inherit}
.up+.up{margin-top:6px}
.empty{color:var(--mut);padding:24px 12px}
footer{grid-column:1/-1;background:var(--bg);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:6px 8px;min-height:76px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cv{width:56px;height:56px}
.np b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--mut)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:18px}
.ib{color:var(--mut);display:grid;place-items:center;width:32px;height:32px}
.ib:hover,.ib.on{color:var(--tx)}
.ib.on{color:var(--g)}
.pp{width:36px;height:36px;background:var(--tx);color:#000;border-radius:50%;display:grid;place-items:center}
.pp:hover{transform:scale(1.06)}
.bar{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--tx) var(--p,0%),#535353 var(--p,0%));flex:1;cursor:pointer;margin:0}
input[type=range]:hover{background:linear-gradient(90deg,var(--g) var(--p,0%),#535353 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--tx)}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vol input{flex:none;width:100px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--tx);color:#000;padding:10px 18px;border-radius:24px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  aside{flex-direction:row;align-items:center;padding:8px;gap:4px;overflow-x:auto}
  .logo{padding:0 8px}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  .up{margin:0 0 0 auto;white-space:nowrap}
  aside .credit{display:none}
  main{padding:0 14px 16px}
  .row{grid-template-columns:24px minmax(0,1fr) 40px 44px}
  .row .al{display:none}
  footer{grid-template-columns:1fr;gap:6px}
  .vol,.np small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">MOOSE<span>.</span></div>
    <button class="nav on" data-nav="home">Home</button>
    <button class="nav" data-nav="search">Search</button>
    <button class="nav" data-nav="mine">Meri music</button>
    <button class="nav" data-nav="lib">Liked songs</button>
    <label class="up" for="file">+ Audio files jodein</label>
    <button class="up" id="dir" hidden>+ Poora folder jodein</button>
    <input id="file" type="file" accept="audio/*" multiple hidden>
    <div class="credit">Made by Dipansh Rai</div>
  </aside>
  <main id="main"></main>
  <footer>
    <div class="np" id="np"></div>
    <div class="ctl">
      <div class="btns">
        <button class="ib" id="shuf" aria-label="Shuffle"></button>
        <button class="ib" id="prev" aria-label="Previous"></button>
        <button class="pp" id="pp" aria-label="Play"></button>
        <button class="ib" id="next" aria-label="Next"></button>
        <button class="ib" id="rep" aria-label="Repeat"></button>
      </div>
      <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    </div>
    <div class="vol"><span class="ib" aria-hidden="true">VOL</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
  </footer>
</div>
<div id="toast" role="status"></div>
<script>
const I={
  play:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>',
  pause:'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>',
  prev:'<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2L6 8l8 6z"/></svg>',
  next:'<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg>',
  shuf:'<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 4h3l6 8h5M1 12h3l2-2.7M10 4h5M13 2l2 2-2 2M13 10l2 2-2 2"/></svg>',
  rep:'<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7V6a2 2 0 012-2h9M11 1l2.5 3L11 7M14 9v1a2 2 0 01-2 2H3M5 15l-2.5-3L5 9"/></svg>'
};
const SC={min:[0,3,5,7,10,12,15],maj:[0,2,4,7,9,12,14],dor:[0,2,3,7,9,10,12]};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const base=[
 ["Neon Chai","Synthwala",104,220,"min","sawtooth",285],
 ["Monsoon Loops","Baarish Club",84,196,"dor","triangle",205],
 ["Midnight Local","Last Metro",118,247,"min","square",265],
 ["Pixel Sunrise","8-Bit Subah",132,262,"maj","square",45],
 ["Rooftop Lo-fi","Chhat Pe",76,175,"dor","triangle",160],
 ["Kesar Drive","Highway 19",110,233,"maj","sawtooth",30],
 ["Static Dreams","Dial Tone",92,208,"min","sine",250],
 ["Tapri Beats","Cutting Chai Crew",98,185,"maj","triangle",12]
];
let LK=new Set();try{LK=new Set(JSON.parse(localStorage.getItem('moose-likes')||'[]'))}catch(_){}
const lib=base.map((b,i)=>({id:i,t:b[0],a:b[1],bpm:b[2],r:b[3],sc:b[4],w:b[5],h:b[6],dur:96,k:'d'+i,liked:LK.has('d'+i),p:(()=>{const r=rng(i*977+5),p=[];for(let k=0;k<16;k++)p.push(r()<.28?-1:Math.floor(r()*7));return p})()}));
let ctx,master,cur=null,playing=false,t0=0,c0=0,nx=0,view='home',q='',shuf=false,rep=false,vol=.7;
const au=new Audio();let tk=0,sy,dest;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const hue=t=>`background:linear-gradient(135deg,hsl(${t.h} 55% 38%),hsl(${(t.h+50)%360} 60% 22%))`;
const step=()=>60/cur.bpm/2;
const now=()=>cur.file?au.currentTime:t0+ctx.currentTime-c0;
const len=()=>cur.file?(au.duration||0):cur.dur;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=vol;dest=ctx.createMediaStreamDestination();master.connect(dest);sy=new Audio();sy.srcObject=dest.stream}
function tone(type,f,when,d,g){const o=ctx.createOscillator(),n=ctx.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(0,when);n.gain.linearRampToValueAtTime(g,when+.01);n.gain.exponentialRampToValueAtTime(.0001,when+d);o.connect(n);n.connect(master);o.start(when);o.stop(when+d+.05)}
function note(i,when){
  const k=cur.p[i%16],s=step();
  if(k>=0){const g=cur.w==='sawtooth'||cur.w==='square'?.05:.14;tone(cur.w,cur.r*2**(SC[cur.sc][k]/12),when,s*1.7,g)}
  if(i%8===0){const off=[0,-4,-2,-5][Math.floor(i/16)%4];tone('sine',cur.r/2*2**(off/12),when,s*7,.2)}
  if(i%4===0){const o=ctx.createOscillator(),n=ctx.createGain();o.frequency.setValueAtTime(130,when);o.frequency.exponentialRampToValueAtTime(40,when+.12);n.gain.setValueAtTime(.35,when);n.gain.exponentialRampToValueAtTime(.001,when+.15);o.connect(n);n.connect(master);o.start(when);o.stop(when+.2)}
}
function sched(){
  if(!cur||cur.file||!playing)return;
  const n=now(),s=step();
  while(nx*s<n+1.5){const w=ctx.currentTime+nx*s-n;if(w>=ctx.currentTime-.02)note(nx,Math.max(w,ctx.currentTime));nx++}
}
function play(i){
  init();
  const t=lib[i];
  au.pause();
  cur=t;
  ctx.resume();
  if(t.file){sy.pause();au.src=t.url;au.volume=vol;au.play().catch(()=>toast('Yeh file chal nahi paayi'))}
  else{t0=0;c0=ctx.currentTime;nx=0;sy.play().catch(()=>{})}
  playing=true;paint();
}
function toggle(){
  if(!cur){play(0);return}
  init();
  if(playing){if(cur.file)au.pause();else{ctx.suspend();sy.pause()}playing=false}
  else{if(cur.file)au.play();else{ctx.resume();sy.play().catch(()=>{})}playing=true}
  paint();
}
function go(d){
  if(!cur){play(0);return}
  let i=cur.id;
  if(shuf&&lib.length>1){do{i=Math.random()*lib.length|0}while(i===cur.id)}
  else i=(i+d+lib.length)%lib.length;
  play(i);
}
function seekTo(x){
  if(!cur)return;
  if(cur.file)au.currentTime=x;else{t0=x;c0=ctx.currentTime;nx=Math.ceil(x/step())}
}
setInterval(()=>{
  sched();
  if(!cur)return;
  const n=now(),d=len();
  $('#cur').textContent=fmt(n);
  $('#dur').textContent=fmt(d);
  if(++tk%12===0&&'mediaSession' in navigator&&d>0&&isFinite(d)){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(n,d),playbackRate:1})}catch(_){}}
  const s=$('#seek');
  if(!s.dragging){s.max=d||100;s.value=n;s.style.setProperty('--p',(d?n/d*100:0)+'%')}
  if(playing&&!cur.file&&d&&n>=d-.05){if(rep){seekTo(0);if(cur.file)au.play()}else go(1)}
},80);
au.addEventListener('ended',()=>{if(rep){au.currentTime=0;au.play()}else go(1)});
function track(t,n){
  return `<div class="row${cur&&cur.id===t.id?' now':''}">
    <button class="n" data-play="${t.id}" aria-label="Play ${esc(t.t)}">${cur&&cur.id===t.id&&playing?I.pause:n+1}</button>
    <button class="ti" data-play="${t.id}"><span class="cv" style="${hue(t)}">${esc(t.t[0])}</span><div><b>${esc(t.t)}</b>${esc(t.a)}</div></button>
    <span class="al">${t.file?'Meri library':'MOOSE Originals'}</span>
    <button class="heart${t.liked?' on':''}" data-like="${t.id}" aria-label="Like">${t.liked?'♥':'♡'}</button>
    ${t.file?`<button data-del="${t.id}" aria-label="Hatayein ${esc(t.t)}">✕</button>`:`<span>${fmt(t.dur)}</span>`}</div>`;
}
function render(){
  const m=$('#main');
  const keep=m.scrollTop;
  let h='';
  if(view==='home'){
    const hr=new Date().getHours(),g=hr<12?'Suprabhat':hr<17?'Namaste':'Shubh sandhya';
    h=`<h1>${g}</h1><div class="quick">${lib.slice(0,6).map(t=>`<button class="q" data-play="${t.id}"><span class="cv" style="${hue(t)}">${esc(t.t[0])}</span>${esc(t.t)}</button>`).join('')}</div><h2>Saari dhunein</h2>${lib.map((t,i)=>track(t,i)).join('')}`;
  }else if(view==='search'){
    const r=lib.filter(t=>(t.t+' '+t.a).toLowerCase().includes(q.toLowerCase()));
    h=`<input class="search" id="q" placeholder="Gaana ya artist dhundein" value="${esc(q)}" aria-label="Search"><h2>${q?'Nateeje':'Sab kuch'}</h2>${r.length?r.map(t=>track(t,lib.indexOf(t))).join(''):'<p class="empty">Kuch nahi mila. Doosra naam try karein.</p>'}`;
  }else if(view==='mine'){
    const r=lib.filter(t=>t.file);
    h='<h1>Meri music</h1>'+(r.length?`<p class="empty" style="padding:0 12px 8px">${r.length} gaane is device mein save hain. Ye offline bhi chalenge.</p>`+r.map((t,i)=>track(t,i)).join(''):'<p class="empty">Abhi koi gaana nahi hai. Sidebar mein "Audio files jodein" dabakar apne gaane chuniye. Ek baar jodne par wo offline bhi chalenge.</p>');
  }else{
    const r=lib.filter(t=>t.liked);
    h=`<h1>Liked songs</h1>${r.length?r.map((t,i)=>track(t,i)).join(''):'<p class="empty">Abhi koi liked gaana nahi hai. Kisi gaane ke saamne ♡ dabayein.</p>'}`;
  }
  m.innerHTML=h+'<p class="credit-main">MOOSE – Made by Dipansh Rai</p>';
  m.scrollTop=keep;
  if(view==='search'){const e=$('#q');if(e&&document.activeElement===document.body&&q){e.focus();e.setSelectionRange(q.length,q.length)}}
}
function paint(){
  $('#pp').innerHTML=playing?I.pause:I.play;
  $('#pp').setAttribute('aria-label',playing?'Pause':'Play');
  $('#np').innerHTML=cur?`<span class="cv" style="${hue(cur)}">${esc(cur.t[0])}</span><div style="min-width:0"><b>${esc(cur.t)}</b><small>${esc(cur.a)}</small></div><button class="heart${cur.liked?' on':''}" data-like="${cur.id}" aria-label="Like">${cur.liked?'♥':'♡'}</button>`:'<small style="color:var(--mut)">Koi gaana chuniye</small>';
  ms();
  $('#shuf').classList.toggle('on',shuf);
  $('#rep').classList.toggle('on',rep);
  render();
}
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-del]'),p=e.target.closest('[data-play]'),l=e.target.closest('[data-like]'),n=e.target.closest('[data-nav]');
  if(x)del(+x.dataset.del);
  else if(p){const i=+p.dataset.play;if(cur&&cur.id===i)toggle();else play(i)}
  else if(l){const t=lib[+l.dataset.like];t.liked=!t.liked;saveLikes();paint()}
  else if(n){view=n.dataset.nav;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b===n));render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();const x=$('#q');x.focus();x.setSelectionRange(q.length,q.length)}});
$('#pp').innerHTML=I.play;$('#prev').innerHTML=I.prev;$('#next').innerHTML=I.next;$('#shuf').innerHTML=I.shuf;$('#rep').innerHTML=I.rep;
$('#pp').onclick=toggle;$('#prev').onclick=()=>{if(cur&&now()>3)seekTo(0);else go(-1)};$('#next').onclick=()=>go(1);
$('#shuf').onclick=()=>{shuf=!shuf;paint()};$('#rep').onclick=()=>{rep=!rep;paint()};
const sk=$('#seek');
sk.addEventListener('pointerdown',()=>sk.dragging=true);
sk.addEventListener('input',()=>{sk.style.setProperty('--p',sk.value/sk.max*100+'%');$('#cur').textContent=fmt(+sk.value)});
sk.addEventListener('change',()=>{seekTo(+sk.value);sk.dragging=false});
const vl=$('#vol');
vl.addEventListener('input',()=>{vol=+vl.value;vl.style.setProperty('--p',vol*100+'%');if(master)master.gain.value=vol;au.volume=vol});
vl.style.setProperty('--p','70%');
const AUD=/\.(mp3|m4a|aac|wav|ogg|opus|flac|weba)$/i;
const db=new Promise((ok,no)=>{try{const r=indexedDB.open('moose',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'k'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
db.catch(()=>{});
const tx=(m,fn)=>db.then(d=>new Promise((ok,no)=>{const t=d.transaction('f',m),r=fn(t.objectStore('f'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
function saveLikes(){try{localStorage.setItem('moose-likes',JSON.stringify(lib.filter(t=>t.liked).map(t=>t.k)))}catch(_){}}
async function tags(f){
  try{
    const b=new Uint8Array(await f.slice(0,65536).arrayBuffer());
    if(b[0]!==73||b[1]!==68||b[2]!==51)return{};
    const v=b[3],end=Math.min(b.length,10+((b[6]&127)<<21|(b[7]&127)<<14|(b[8]&127)<<7|(b[9]&127))),o={};
    let p=10;
    while(p+10<end){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      const z=v===4?((b[p+4]&127)<<21|(b[p+5]&127)<<14|(b[p+6]&127)<<7|(b[p+7]&127)):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7]);
      if(!z||z<0)break;
      if(id==='TIT2'||id==='TPE1'){const e=b[p+10];o[id]=new TextDecoder(e===1?'utf-16':e===2?'utf-16be':e===3?'utf-8':'iso-8859-1').decode(b.subarray(p+11,p+10+z)).replace(/\0/g,'').trim()}
      p+=10+z;
    }
    return{t:o.TIT2,a:o.TPE1};
  }catch(_){return{}}
}
function addRec(r){lib.push({id:lib.length,k:r.k,t:r.t||r.name.replace(/\.[^.]+$/,''),a:r.a||'Meri file',file:true,url:URL.createObjectURL(r.blob),h:[...r.k].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)%360,dur:0,liked:LK.has(r.k)})}
async function addFiles(fs){
  fs=fs.filter(f=>f.type.startsWith('audio')||AUD.test(f.name));
  let n=0,bad=0;
  for(const f of fs){
    const k=f.name+'|'+f.size;
    if(lib.some(t=>t.k===k))continue;
    const g=await tags(f),r={k,name:f.name,t:g.t,a:g.a,blob:f};
    try{await tx('readwrite',s=>s.put(r))}catch(_){bad++}
    addRec(r);n++;
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  toast(!fs.length?'Koi audio file nahi mili':bad?n+' gaane jude, par '+bad+' offline save nahi ho paaye':n+' gaane jude aur offline save ho gaye');
  render();
}
async function scanDir(h){const o=[];for await(const [n,e] of h.entries()){if(e.kind==='file'&&AUD.test(n))o.push(await e.getFile());else if(e.kind==='directory')o.push(...await scanDir(e))}return o}
async function del(i){
  const t=lib[i];
  if(!t||!confirm('"'+t.t+'" hatayein?'))return;
  if(cur===t){au.pause();cur=null;playing=false}
  try{await tx('readwrite',s=>s.delete(t.k))}catch(_){}
  URL.revokeObjectURL(t.url);lib.splice(i,1);lib.forEach((x,j)=>x.id=j);paint();
}
$('#file').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
const dir=$('#dir');
if(window.showDirectoryPicker){dir.hidden=false;dir.onclick=async()=>{try{const h=await showDirectoryPicker({mode:'read'});toast('Folder scan ho raha hai…');await addFiles(await scanDir(h))}catch(_){}}}
tx('readonly',s=>s.getAll()).then(rs=>{rs.sort((a,b)=>a.name.localeCompare(b.name)).forEach(addRec);render()}).catch(()=>{});
function ms(){
  const m=navigator.mediaSession;if(!m)return;
  if(!cur){m.metadata=null;m.playbackState='none';return}
  m.metadata=new MediaMetadata({title:cur.t,artist:cur.a,album:cur.file?'MOOSE – Meri music':'MOOSE Originals',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  m.playbackState=playing?'playing':'paused';
}
if('mediaSession' in navigator){
  const m=navigator.mediaSession,h=(a,f)=>{try{m.setActionHandler(a,f)}catch(_){}};
  h('play',()=>{if(!playing)toggle()});h('pause',()=>{if(playing)toggle()});
  h('previoustrack',()=>go(-1));h('nexttrack',()=>go(1));
  h('seekto',d=>seekTo(d.seekTime));
  h('seekbackward',()=>seekTo(Math.max(0,now()-10)));h('seekforward',()=>seekTo(Math.min(len(),now()+10)));
}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();toggle()}});
paint();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
